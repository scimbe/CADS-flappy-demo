# Demo: serve https://flappy-demo.bunsenbrenner.org through the Browser Plane, with
# a real Let's Encrypt certificate issued CORE-side via deSEC DNS-01 (#219) — the
# SAME publishing shape as examples/help-site (help.bunsenbrenner.org).
#
# This is an OPTIONAL demo subsystem: bring it up to enable, `down` to take it
# offline. flappy-agent onboards as a remote agent against a control-plane/edge
# that does NOT have to run on this host (e.g. the hosted bunsenbrenner.org
# plane) — CT_AGENT_CP_URL/CT_AGENT_EDGE just need to be reachable over the
# network, so this stack only needs its own private compose network.
#
#   enable:   examples/flappy-demo/run-demo.sh up      (or: docker compose -f … up -d)
#   disable:  examples/flappy-demo/run-demo.sh down     (takes the demo offline)
#
# Env comes from docker/deploy/.env (see docs/dns01-desec.md).
services:
  flappy-origin:
    # Plain Caddy: terminates TLS with a cert issued CORE-side (#219,
    # scripts/authorize-pipeline.sh) and mounted read-only below — no ACME
    # client or deSEC token in this container at all. Serves the self-contained
    # Flappy Pipeline Studio page (index.html).
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    volumes:
      - ./index.html:/srv/index.html:ro
      # #168: the untracked gate.json (SHA-256 hash of the demo password only) that
      # the page fetches — generated by run-demo.sh from the out-of-band
      # FLAPPY_DEMO_PASSWORD; never committed. Create it before `docker compose up`
      # (run-demo.sh does this for you) or Docker will bind-mount a directory.
      - ./gate.json:/srv/gate.json:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # #219: fullchain.pem + privkey.pem, issued by the operator's
      # scripts/authorize-pipeline.sh and relayed out of band — never a
      # DESEC_TOKEN, never an ACME client running in this repo.
      - ${FLAPPY_CERT_DIR:?set FLAPPY_CERT_DIR=<dir with fullchain.pem+privkey.pem from the operator>}:/certs:ro
      - flappy_caddy_data:/data
    expose:
      - "443"   # reachable only via the tunnel/agent, not published to the host
    restart: unless-stopped

  flappy-agent:
    # Browser-Plane mode (SNI passthrough) -- built from the standalone
    # scimbe/ct-agent repo via Agent.Dockerfile, not from a sibling
    # CADS-Tunnel checkout (that stopped working once ct-agent's source was
    # extracted out of CADS-Tunnel core; see Agent.Dockerfile's own comment).
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # Bumped 2026-08-14 to v0.4.16 -- THE actual #494 root cause (rendezvous-ack-reader
        # deadlock on fresh :443 pairings). See Agent.Dockerfile's own comment for the full
        # history and mechanism.
        - CT_AGENT_REF=${CT_AGENT_REF:-738502252eba6763c6d2c6407d06b28d3174d15e}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=flappy-demo.bunsenbrenner.org
      - CT_AGENT_TOKEN=${FLAPPY_AGENT_TOKEN:-}
      - CT_AGENT_ORIGIN=flappy-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${FLAPPY_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${FLAPPY_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${FLAPPY_JOIN_TOKEN:?single-use join token}
      - CT_AGENT_ID=flappy-demo
      - CT_AGENT_EDGE_CERT_URL=${FLAPPY_AGENT_EDGE_CERT_URL:-}
      # #141: persist onboarding so a restart RESTORES the bound identity instead of
      # re-redeeming the single-use join token (the crash-loop that takes a demo down).
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      # #36: retry the edge forever so a bounced edge is rejoined automatically.
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    command: ["ct-agent", "onboard"]
    depends_on:
      - flappy-origin
    restart: unless-stopped
    volumes:
      - flappy_agent_state:/var/lib/ct-agent

  flappy-crew-bridge:
    # #173 distributed crew: the HTTP bridge the origin reverse-proxies `POST /crew/build` to.
    # It runs the crew — safety_check, then physics + art — by dialing each role's agent over the
    # REAL Agent-Fabric tunnel with `ct-agent channel` in CT_CHANNEL_CALL_SERVICE mode. Each role
    # needs its OWN channel identity (a different peer), so a single set of global CT_CHANNEL_* can't
    # serve all three — instead each CREW_*_CMD carries its role's identity via an `env …` prefix
    # that reads per-role vars ($$… = a literal $ so the bridge's own `sh -c` expands them at call
    # time, keeping the grants/keys in their own env vars rather than inlined into the command).
    #
    # Thin-bridge migration (#219): the HTTP server + wire-format assembly used to be
    # `ct-crew-bridge`, a binary built INSIDE CADS-Tunnel core. It's now plain Node
    # (bridge/server.js, this repo) — only the generic `ct-agent` CLI (used by the CREW_*_CMD role
    # dials below) still comes from core, via bridge/Dockerfile's named `tunnel-src` build context.
    #
    # TARGET-STATE wiring (maintainer/central 2026-07-25 "wire it regardless"): the demo only goes
    # live once sink/source-2 actually serve `text_generation`/`safety_check` and central provisions
    # the per-role grants below (still #173's #1 blocker). A NAT'd bridge may also need
    # CT_CHANNEL_RELAY_ONLY=1 per role. Until then this service starts but every /crew/build 502s
    # (the browser fails closed to its local stand-in) — the demo page still works, just locally.
    build:
      context: .
      dockerfile: bridge/Dockerfile
      additional_contexts:
        tunnel-src: ${CT_TUNNEL_SRC:-../CADS-Tunnel}
    command: ["node", "server.js"]
    # OPT-IN: the bridge only starts with `docker compose --profile crew up`. Without the profile the
    # default `up` brings up just the origin + Browser-Plane agent (the demo page, which fails closed
    # to its local stand-in) — so the demo is never held hostage to crew identities that don't exist
    # yet. The per-role vars below therefore DEFAULT EMPTY (`:-`), never `:?`-required: a missing one
    # must not break the whole stack's interpolation (compose interpolates the file before filtering
    # by profile). Set them (in docker/deploy/.env) once central provisions the grants, then
    # `--profile crew up`.
    profiles: ["crew"]
    environment:
      - CREW_BRIDGE_LISTEN=0.0.0.0:8788
      # Shared edge rendezvous/relay for every role dial.
      - CREW_EDGE_BROKER=${CREW_EDGE_BROKER:-}
      - CREW_EDGE_RELAY=${CREW_EDGE_RELAY:-}
      # Per-role channel-join identities (operator-supplied from central's provisioning; SECRET hex).
      - CREW_PHYSICS_GRANT=${CREW_PHYSICS_GRANT:-}
      - CREW_PHYSICS_HOLDER_KEY=${CREW_PHYSICS_HOLDER_KEY:-}
      # #207: central-served standby (candidate 2) for when source-2's physics serve is down.
      - CREW_PHYSICS_STANDBY_GRANT=${CREW_PHYSICS_STANDBY_GRANT:-}
      - CREW_PHYSICS_NOISE_KEY=${CREW_PHYSICS_NOISE_KEY:-}
      - CREW_ART_GRANT=${CREW_ART_GRANT:-}
      - CREW_ART_HOLDER_KEY=${CREW_ART_HOLDER_KEY:-}
      # #207: central-served standby (candidate 2) for when sink's art serve is down, same
      # pattern as CREW_PHYSICS_STANDBY_GRANT above.
      - CREW_ART_STANDBY_GRANT=${CREW_ART_STANDBY_GRANT:-}
      - CREW_ART_NOISE_KEY=${CREW_ART_NOISE_KEY:-}
      - CREW_SAFETY_GRANT=${CREW_SAFETY_GRANT:-}
      - CREW_SAFETY_HOLDER_KEY=${CREW_SAFETY_HOLDER_KEY:-}
      - CREW_SAFETY_NOISE_KEY=${CREW_SAFETY_NOISE_KEY:-}
      # One dial per role, each scoped to its own identity (see the note above re $$ expansion).
      - "CREW_PHYSICS_CMD=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=text_generation CT_CHANNEL_BROKER=$$CREW_EDGE_BROKER CT_CHANNEL_RELAY=$$CREW_EDGE_RELAY CT_CHANNEL_LISTEN=0.0.0.0:0 CT_CHANNEL_GRANT=$$CREW_PHYSICS_GRANT CT_CHANNEL_HOLDER_KEY=$$CREW_PHYSICS_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$CREW_PHYSICS_NOISE_KEY ct-agent channel"
      # #207 Slice A: candidate 2 — central's standby, tried only if source-2 (candidate 1) fails.
      - "CREW_PHYSICS_CMD_2=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=text_generation CT_CHANNEL_BROKER=$$CREW_EDGE_BROKER CT_CHANNEL_RELAY=$$CREW_EDGE_RELAY CT_CHANNEL_LISTEN=0.0.0.0:0 CT_CHANNEL_GRANT=$$CREW_PHYSICS_STANDBY_GRANT CT_CHANNEL_HOLDER_KEY=$$CREW_PHYSICS_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$CREW_PHYSICS_NOISE_KEY ct-agent channel"
      - "CREW_ART_CMD=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=text_generation CT_CHANNEL_BROKER=$$CREW_EDGE_BROKER CT_CHANNEL_RELAY=$$CREW_EDGE_RELAY CT_CHANNEL_LISTEN=0.0.0.0:0 CT_CHANNEL_GRANT=$$CREW_ART_GRANT CT_CHANNEL_HOLDER_KEY=$$CREW_ART_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$CREW_ART_NOISE_KEY ct-agent channel"
      # #207 Slice A: candidate 2 — central's standby, tried only if sink (candidate 1) fails.
      - "CREW_ART_CMD_2=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=text_generation CT_CHANNEL_BROKER=$$CREW_EDGE_BROKER CT_CHANNEL_RELAY=$$CREW_EDGE_RELAY CT_CHANNEL_LISTEN=0.0.0.0:0 CT_CHANNEL_GRANT=$$CREW_ART_STANDBY_GRANT CT_CHANNEL_HOLDER_KEY=$$CREW_ART_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$CREW_ART_NOISE_KEY ct-agent channel"
      - "CREW_SAFETY_CMD=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=safety_check CT_CHANNEL_BROKER=$$CREW_EDGE_BROKER CT_CHANNEL_RELAY=$$CREW_EDGE_RELAY CT_CHANNEL_LISTEN=0.0.0.0:0 CT_CHANNEL_GRANT=$$CREW_SAFETY_GRANT CT_CHANNEL_HOLDER_KEY=$$CREW_SAFETY_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$CREW_SAFETY_NOISE_KEY ct-agent channel"
      # Global "prompts built" counter shown on the studio's main page (GET /crew/count) --
      # needs a real writable volume since /srv itself is the image's own COPY'd code, not
      # persistent storage worth keeping (same reasoning as CADS-webconference-demo's
      # access-requests volume).
      - CREW_PROMPT_COUNT_FILE=/srv/data/prompt-count.json
      # #232: shared/hosted games (POST /share -> GET /g/:id), same persistent volume as the
      # prompt counter above -- a UUID-addressed pastebin for the exact standalone .html
      # "Generate my game" already produces, so a share link survives a bridge restart.
      - CREW_SHARED_GAMES_DIR=/srv/data/shared-games
    volumes:
      - flappy_crew_state:/srv/data
    expose:
      - "8788"   # reached only by the origin's reverse_proxy on the compose network
    depends_on:
      - flappy-origin
    restart: unless-stopped

volumes:
  flappy_caddy_data:
  flappy_agent_state:
  flappy_crew_state:

# This stack's own private network — sufficient when onboarding against a
# remote/hosted control-plane (e.g. bunsenbrenner.org): the agent only needs
# CT_AGENT_CP_URL/CT_AGENT_EDGE reachable over the network, not shared docker
# networking with the plane. If the plane ever runs on THIS same host again,
# switch back to an external `ct-selfhost_default` network instead.
networks:
  default:
    name: flappy-demo_default
